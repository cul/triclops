development:
  run_queued_jobs_inline: true
  remote_request_api_key: 'changethis'
  jwt_hmac_secret: 'changethissecret'
  access_stats_enabled: false
  raster_cache:
    on_miss: 'error' # ['generate_and_do_not_cache', 'generate_and_cache', 'error']
    path: 'raster'
    read_location_prefix: <%= 'file://' + Rails.root.join('tmp', 'triclops_development_cache').to_s %>
    write_location_prefix: <%= 'file://' + Rails.root.join('tmp', 'triclops_development_cache').to_s %>
    #read_location_prefix: 's3://example-bucket/triclops/development_cache'
    #write_location_prefix: 's3://example-bucket/triclops/development_cache'
  lock:
    lock_timeout: 10
    retry_delay: 1
    retry_count: 11
  tmp_directory: <%= Rails.root.join('tmp', 'triclops_development_tmp') %>
  vips_tmp_directory: <%= Rails.root.join('tmp', 'triclops_development_tmp') %>

